name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 KST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Patch 3d-contrib
        run: |
          git clone --depth 1 --branch latest https://github.com/yoshi389111/github-profile-3d-contrib.git "$RUNNER_TEMP/_3d"
          sed -i 's/contributesLanguage.slice(0, 5)/contributesLanguage.slice(0, 7)/' "$RUNNER_TEMP/_3d/dist/index.js"
          grep -n "contributesLanguage.slice(0, 7)" "$RUNNER_TEMP/_3d/dist/index.js"

      - name: Generate 3D contrib
        run: node "$RUNNER_TEMP/_3d/dist/index.js"
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --staged --quiet || git commit -m "generated"
          git push
